name: lavanderia_delivery
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:

  cached_network_image: ^3.3.1
  carousel_slider: ^5.1.1
  connectivity_plus: ^7.1.1
  dio: ^5.7.0
  easy_localization: ^3.0.7
  equatable: ^2.0.5
  expandable_page_view: ^1.0.17
  file_picker: ^10.3.3
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_local_notifications: ^18.0.1
  flutter_svg: ^2.0.14
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^10.8.0
  gap: ^3.0.1
  geocoding: ^5.0.0
  geolocator: ^13.0.2
  get_it: ^8.0.2
  go_router: ^15.1.2
  google_sign_in: ^6.2.2
  http: ^1.2.2
  image: ^4.1.3
  image_picker: ^1.1.2
  internet_connection_checker_plus: ^2.0.0
  intl_phone_field: ^3.2.0
  loading_animation_widget: ^1.3.0
  logger: ^2.5.0
  lottie: ^3.3.1
  path_provider: ^2.1.5
  pdf: ^3.10.4
  permission_handler: ^11.0.1
  pin_code_text_field: ^1.8.0
  pinput: ^5.0.1
  pretty_dio_logger: ^1.4.0
  printing: ^5.11.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sign_in_with_apple: ^7.0.1
  slide_to_act: ^2.0.2
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  open_file: ^3.2.1
  flutter_image_compress: ^2.4.0
  cupertino_icons: ^1.0.8
  video_player: ^2.14.0
  flutter_widget_from_html_core: ^0.17.4
  signalr_netcore: ^1.4.4
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  fonts:
  # الديزاين: Regular 400 نصوص، Medium 500 عناصر مهمة، SemiBold 600 عناوين، Bold 700 إبراز
  - family: Cairo
    fonts:
      # ميتاداتا الملف usWeightClass 250، وفلاتر بيقبل مضاعفات 100 بس
      - asset: assets/fonts/Cairo-ExtraLight.ttf
        weight: 200
      - asset: assets/fonts/Cairo-Light.ttf
        weight: 300
      - asset: assets/fonts/Cairo-Regular.ttf
        weight: 400
      - asset: assets/fonts/Cairo-Medium.ttf
        weight: 500
      - asset: assets/fonts/Cairo-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Cairo-Bold.ttf
        weight: 700
      - asset: assets/fonts/Cairo-ExtraBold.ttf
        weight: 800
      - asset: assets/fonts/Cairo-Black.ttf
        weight: 900

        

  assets:
    - assets/
    - assets/icon/
    - assets/icons/
    - assets/fonts/
    - assets/images/
    - assets/translations/

flutter_assets:
  assets_path: assets/
  output_path: lib/core/style/
  filename: assets.dart

